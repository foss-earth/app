<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Scene tuner</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0f18; color: #dde; font: 13px/1.4 system-ui, sans-serif; display: flex; gap: 20px; padding: 16px; align-items: flex-start; }
  #stage { position: sticky; top: 16px; flex: none; }
  #view { position: relative; background: #000; border-radius: 12px; overflow: hidden; }
  #view iframe { position: absolute; left: 0; top: 0; border: 0; pointer-events: none; transform-origin: 0 0; }
  #view svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #status { margin-top: 8px; color: #9ab; max-width: 640px; }
  #status b { color: #fff; font-weight: 600; }
  #panel { flex: 1; min-width: 360px; max-width: 520px; }
  fieldset { border: 1px solid #2a3348; border-radius: 10px; margin: 0 0 12px; padding: 8px 12px 10px; }
  legend { color: #fff; font-weight: 600; padding: 0 4px; }
  .row { display: grid; grid-template-columns: 150px 1fr 82px; gap: 8px; align-items: center; margin: 5px 0; }
  .row.wide { grid-template-columns: 150px 1fr; }
  .row label { color: #aab; }
  input[type=number], input[type=text], select { background: #121826; color: #fff; border: 1px solid #2a3348; border-radius: 6px; padding: 3px 6px; font: inherit; width: 100%; box-sizing: border-box; }
  input[type=range] { width: 100%; }
  button { background: #2b4a7a; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .readout { display: grid; grid-template-columns: 150px 1fr; gap: 2px 8px; }
  .readout span:nth-child(odd) { color: #aab; }
  .hint { color: #889; font-size: 12px; }
  code, pre { color: #cde; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  pre { background: #121826; border-radius: 8px; padding: 8px; margin: 6px 0 0; max-height: 220px; overflow: auto; }
  #message { margin-top: 6px; }
  .bad { color: #f99; }
  .good { color: #9e9; }
  #result img { display: block; width: 100%; border-radius: 10px; margin-top: 8px; }
</style>
<div id="stage">
  <div id="view"><iframe id="app" title="FOSS Earth"></iframe><svg id="overlay"></svg></div>
  <div id="status">Starting…</div>
  <div id="result"></div>
</div>
<div id="panel"></div>
<script type="module" src="./tune.mjs"></script>
</html>
